<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火箭倍数 · 小游戏</title>
<style>
:root{
  --bg:#0b0410; --bg2:#160a24; --panel:#1c0f2e; --line:#3a1f57;
  --gold:#ffcf5c; --green:#59f2a8; --red:#ff5f6d; --purple:#a06bff;
  --text:#f2e9ff; --dim:#9c85bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 60%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  min-height:100%;
  padding:16px;
}
.wrap{width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px;}
.top{display:flex; justify-content:space-between; align-items:center;}
.brand{font-size:15px; letter-spacing:.5px; color:var(--dim);}
.balance{font-size:15px; font-weight:600; color:var(--gold);}
.stage{
  position:relative; height:280px; border-radius:20px;
  background:linear-gradient(180deg,#1a0c2c,#0d0518 80%);
  border:1px solid var(--line); overflow:hidden;
}
.stars{position:absolute; inset:0; background-image:
  radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
  radial-gradient(1px 1px at 60% 70%, #fff6, transparent),
  radial-gradient(1.5px 1.5px at 80% 20%, #fff9, transparent),
  radial-gradient(1px 1px at 40% 85%, #fff5, transparent),
  radial-gradient(1.5px 1.5px at 90% 60%, #fff7, transparent);
  opacity:.8;
}
.mult{
  position:absolute; top:20px; left:0; right:0; text-align:center;
  font-size:44px; font-weight:700;
}
.mult.live{color:var(--green);}
.mult.crashed{color:var(--red);}
.mult.idle{color:var(--dim); font-size:20px; font-weight:500;}
.rocket{
  position:absolute; width:34px; height:34px; left:20px; bottom:20px;
  transition:left .18s linear, bottom .18s linear, transform .18s linear;
  font-size:30px; transform:rotate(45deg);
  filter:drop-shadow(0 0 8px rgba(255,207,92,.6));
}
.trail{
  position:absolute; left:0; bottom:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold));
  transform-origin:left bottom;
}
.msg{position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:13px; color:var(--dim);}
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:16px; display:flex; flex-direction:column; gap:12px;
}
.bet-row{display:flex; gap:10px; align-items:center;}
.bet-input{
  flex:1; background:#120820; border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; color:var(--text); font-size:16px; font-weight:600;
  -moz-appearance:textfield;
}
.bet-input::-webkit-outer-spin-button,.bet-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.chip{
  background:#251238; border:1px solid var(--line); color:var(--dim);
  border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600;
}
.chip:active{background:#341a4d;}
.chips{display:flex; gap:8px;}
.main-btn{
  border:none; border-radius:14px; padding:16px; font-size:18px; font-weight:700;
  width:100%; color:#0b0410; cursor:pointer;
}
.main-btn.start{background:linear-gradient(180deg,#7ef2ae,var(--green));}
.main-btn.cashout{background:linear-gradient(180deg,#ffe08a,var(--gold));}
.main-btn:disabled{opacity:.4;}
.hint{font-size:12px; color:var(--dim); text-align:center; line-height:1.5;}
.history{display:flex; gap:6px; flex-wrap:wrap;}
.h-tag{font-size:12px; padding:4px 8px; border-radius:8px; font-weight:600;}
.h-tag.win{background:rgba(89,242,168,.15); color:var(--green);}
.h-tag.lose{background:rgba(255,95,109,.15); color:var(--red);}
.footer-note{font-size:11px; color:var(--dim); text-align:center; opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">🚀 火箭倍数</div>
    <div class="balance" id="balance">积分 1000</div>
  </div>

  <div class="stage" id="stage">
    <div class="stars"></div>
    <div class="trail" id="trail"></div>
    <div class="rocket" id="rocket">🚀</div>
    <div class="mult idle" id="mult">准备开始</div>
    <div class="msg" id="msg">下注后点击"开始",倍数上涨时点"提现"锁定收益</div>
  </div>

  <div class="panel">
    <div class="bet-row">
      <input class="bet-input" id="betInput" type="number" value="50" min="1" step="10">
      <div class="chips">
        <button class="chip" data-add="50">+50</button>
        <button class="chip" data-add="100">+100</button>
      </div>
    </div>
    <button class="main-btn start" id="mainBtn">开始下注</button>
    <div class="hint" id="hintText">每局最低下注 1 积分。崩盘前未提现将输掉本局积分。</div>
    <div class="history" id="history"></div>
  </div>

  <div class="footer-note">虚拟积分游戏,仅供娱乐,不可兑换任何真实货币或奖励</div>
</div>

<script>
(function(){
  let balance = 1000;
  let betAmount = 50;
  let state = 'idle'; // idle | flying | crashed
  let currentMult = 1.00;
  let crashPoint = 1;
  let rafId = null;
  let startTime = 0;
  let history = [];

  const balanceEl = document.getElementById('balance');
  const multEl = document.getElementById('mult');
  const msgEl = document.getElementById('msg');
  const rocketEl = document.getElementById('rocket');
  const trailEl = document.getElementById('trail');
  const mainBtn = document.getElementById('mainBtn');
  const betInput = document.getElementById('betInput');
  const hintText = document.getElementById('hintText');
  const historyEl = document.getElementById('history');
  const stage = document.getElementById('stage');

  function fmtBalance(){ balanceEl.textContent = '积分 ' + balance.toLocaleString(); }
  fmtBalance();

  document.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state!=='idle') return;
      const cur = parseInt(betInput.value)||0;
      betInput.value = cur + parseInt(btn.dataset.add);
    });
  });

  // 生成崩盘点:偏向较低倍数,长尾偶尔很高,模拟娱乐性曲线
  function rollCrashPoint(){
    const r = Math.random();
    // house-edge style distribution, capped for demo
    const point = Math.max(1.00, (0.98 / (1 - r)) * 0.98);
    return Math.min(point, 50);
  }

  function resetStageVisual(){
    rocketEl.style.left = '20px';
    rocketEl.style.bottom = '20px';
    rocketEl.style.transform = 'rotate(45deg)';
    trailEl.style.width = '0px';
    trailEl.style.height = '2px';
  }

  function startRound(){
    const val = parseInt(betInput.value);
    if(!val || val < 1){ hintText.textContent = '请输入有效下注积分'; return; }
    if(val > balance){ hintText.textContent = '积分不足'; return; }
    betAmount = val;
    balance -= betAmount;
    fmtBalance();

    state = 'flying';
    currentMult = 1.00;
    crashPoint = rollCrashPoint();
    startTime = performance.now();
    resetStageVisual();
    multEl.className = 'mult live';
    msgEl.textContent = '飞行中… 随时可点击提现';
    mainBtn.textContent = '提现 (' + currentMult.toFixed(2) + 'x)';
    mainBtn.className = 'main-btn cashout';
    betInput.disabled = true;
    document.querySelectorAll('.chip').forEach(b=>b.disabled=true);
    tick();
  }

  function tick(){
    const elapsed = (performance.now() - startTime) / 1000;
    currentMult = 1 + elapsed * elapsed * 0.18 + elapsed * 0.25;

    if(currentMult >= crashPoint){
      return crashRound();
    }

    multEl.textContent = currentMult.toFixed(2) + 'x';
    mainBtn.textContent = '提现 (' + currentMult.toFixed(2) + 'x · ' + Math.floor(betAmount*currentMult) + ')';

    const progress = Math.min(elapsed/6, 1);
    const left = 20 + progress * 220;
    const bottom = 20 + progress * 180;
    rocketEl.style.left = left + 'px';
    rocketEl.style.bottom = bottom + 'px';
    trailEl.style.width = (left-20+10) + 'px';

    rafId = requestAnimationFrame(tick);
  }

  function crashRound(){
    cancelAnimationFrame(rafId);
    state = 'crashed';
    multEl.className = 'mult crashed';
    multEl.textContent = '💥 ' + crashPoint.toFixed(2) + 'x';
    msgEl.textContent = '崩盘!本局积分已损失';
    pushHistory(crashPoint.toFixed(2)+'x', false);
    endRoundUI();
  }

  function cashOut(){
    if(state!=='flying') return;
    cancelAnimationFrame(rafId);
    const win = Math.floor(betAmount * currentMult);
    balance += win;
    fmtBalance();
    state = 'crashed';
    multEl.className = 'mult win';
    multEl.style.color = 'var(--gold)';
    multEl.textContent = '已提现 ' + currentMult.toFixed(2) + 'x';
    msgEl.textContent = '获得 ' + win + ' 积分';
    pushHistory(currentMult.toFixed(2)+'x', true);
    endRoundUI();
  }

  function pushHistory(label, win){
    history.unshift({label, win});
    history = history.slice(0,8);
    historyEl.innerHTML = history.map(h =>
      '<span class="h-tag '+(h.win?'win':'lose')+'">'+h.label+'</span>'
    ).join('');
  }

  function endRoundUI(){
    setTimeout(()=>{
      state = 'idle';
      multEl.className = 'mult idle';
      multEl.style.color = '';
      multEl.textContent = '准备开始';
      msgEl.textContent = '下注后点击"开始",倍数上涨时点"提现"锁定收益';
      mainBtn.textContent = '开始下注';
      mainBtn.className = 'main-btn start';
      betInput.disabled = false;
      document.querySelectorAll('.chip').forEach(b=>b.disabled=false);
      resetStageVisual();
      if(balance <= 0){
        hintText.textContent = '积分已用完,刷新页面可重置为 1000 积分';
        mainBtn.disabled = true;
      }
    }, 1400);
  }

  mainBtn.addEventListener('click', ()=>{
    if(state==='idle') startRound();
    else if(state==='flying') cashOut();
  });
})();
</script>
</body>
</html>
